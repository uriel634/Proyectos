name: Deploy PedidoClaro

on:
  push:
    branches: [main]
    paths:
      - "proyectos/pedidoclaro/**"
      - ".github/workflows/deploy-pedidoclaro.yml"
  workflow_dispatch: {}

jobs:
  deploy-worker:
    name: Deploy Worker (D1 + API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyectos/pedidoclaro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy Pages (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyectos/pedidoclaro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto de Pages si no existe
        run: npx wrangler pages project create pedidoclaro-frontend --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Pages
        run: npx wrangler pages deploy public --project-name=pedidoclaro-frontend --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

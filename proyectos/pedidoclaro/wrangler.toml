name = "pedidoclaro"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Un solo Worker atiende todas las rutas (Worker 1, 2, 5 y 7 vía fetch;
# Worker 3, 4 son funciones internas invocadas desde el Worker 1;
# Worker 6 y 7 corren también por cron, ver [triggers] abajo).
#
# Endpoints:
#   POST  /pedido               -> Worker 1 (registrar pedido)
#   GET   /pedidos               -> Worker 2 (tablero)
#   PATCH /pedido/:id/estatus    -> Worker 5 (cambio de estatus)
#   POST  /sync/pos              -> Worker 7 (sync manual con POS externo)

[[d1_databases]]
binding = "DB"
database_name = "pedidoclaro-db"
database_id = "c43167c8-f319-4d05-8244-d900ba921e04"

[triggers]
crons = [
  "0 14 * * *",  # Worker 6 — reporte matutino, 8:00 AM hora México (UTC-6)
  "*/5 * * * *", # Worker 7 — sync POS
]

# Workers Logs — deja ver en vivo los console.error/console.log del Worker
# (útil para diagnosticar por qué falla un envío de WhatsApp).
[observability]
enabled = true
head_sampling_rate = 1

# Los secrets (credenciales, tokens, teléfonos) NO se definen aquí.
# Se configuran con `wrangler secret put <NOMBRE>` — ver README.md.
